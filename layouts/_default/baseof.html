<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ── Primary SEO Meta ─────────────────────────────────────────── -->
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ block "description" . }}Aadhya Abode offers premium fully-furnished 2BHK vacation homes in Kanyakumari, Tamil Nadu. Book a luxury short-term stay near Vivekananda Rock. Instant WhatsApp confirmation.{{ end }}" />
  <meta name="keywords" content="holiday home Kanyakumari, vacation rental Kanyakumari, 2BHK stay Kanyakumari, luxury homestay Kanyakumari, short term rental Tamil Nadu, Aadhya Abode, Kanyakumari villa, family vacation home" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Aadhya Abode" />
  <link rel="canonical" href="{{ .Site.BaseURL }}" />

  <!-- ── Open Graph (Facebook / WhatsApp preview) ─────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Aadhya Abode" />
  <meta property="og:title" content="{{ block "og_title" . }}Aadhya Abode — Luxury Vacation Home in Kanyakumari{{ end }}" />
  <meta property="og:description" content="{{ block "og_description" . }}Stay in a fully-furnished 2BHK luxury home at Kanyakumari. 5-star rated. Minutes from Vivekananda Rock. Book instantly via WhatsApp.{{ end }}" />
  <meta property="og:url" content="{{ .Site.BaseURL }}" />
  <meta property="og:image" content="{{ .Site.BaseURL }}images/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />

  <!-- ── Twitter Card ──────────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ block "tw_title" . }}Aadhya Abode — Luxury Vacation Home in Kanyakumari{{ end }}" />
  <meta name="twitter:description" content="{{ block "tw_description" . }}Stay in a fully-furnished 2BHK luxury home at Kanyakumari. 5-star rated. Instant WhatsApp booking.{{ end }}" />
  <meta name="twitter:image" content="{{ .Site.BaseURL }}images/og-cover.jpg" />

  <!-- ── Favicon ───────────────────────────────────────────────────── -->
  <link rel="icon" type="image/jpeg" href="/images/logo/aadhya-abode-logo.jpeg" />
  <link rel="apple-touch-icon" href="/images/logo/aadhya-abode-logo.jpeg" />

  <!-- ── Compiled Tailwind CSS ─────────────────────────────────────── -->
  <link rel="stylesheet" href="/css/tailwind.css" />

  <!-- ── Typography: Inter ─────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ── JSON-LD Structured Data ───────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "LodgingBusiness",
        "@id": "https://aadhyaabode.com/#lodging",
        "name": "Aadhya Abode",
        "description": "Premium fully-furnished 2BHK luxury vacation home for short-term stays in Kanyakumari, Tamil Nadu, India. Ideal for families and groups up to 8 guests.",
        "url": "https://aadhyaabode.com/",
        "telephone": "+918015160563",
        "email": "care.babystep@gmail.com",
        "image": "https://aadhyaabode.com/images/og-cover.jpg",
        "priceRange": "₹₹",
        "starRating": {
          "@type": "Rating",
          "ratingValue": "5"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "reviewCount": "10",
          "bestRating": "5",
          "worstRating": "1"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kanyakumari",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "8.0883",
          "longitude": "77.5385"
        },
        "sameAs": [
          "https://instagram.com/aadhyaabode",
          "https://www.airbnb.co.in/rooms/1702921509210422797",
          "https://maps.app.goo.gl/8hFLJTv4RXsi5u2EA"
        ],
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Free WiFi", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Air Conditioning", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Full Kitchen", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Power Backup", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Parking", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Smart TV", "value": true }
        ],
        "numberOfRooms": 2,
        "petsAllowed": false,
        "checkinTime": "14:00",
        "checkoutTime": "11:00",
        "currenciesAccepted": "INR",
        "paymentAccepted": "UPI, Bank Transfer"
      },
      {
        "@type": "WebSite",
        "@id": "https://aadhyaabode.com/#website",
        "url": "https://aadhyaabode.com/",
        "name": "Aadhya Abode",
        "description": "Luxury vacation home in Kanyakumari",
        "inLanguage": "en-IN"
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Where is Aadhya Abode located?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aadhya Abode is located in Kanyakumari, Tamil Nadu, India — just 5 minutes from the iconic Vivekananda Rock Memorial and Thiruvalluvar Statue."
            }
          },
          {
            "@type": "Question",
            "name": "How many guests can Aadhya Abode accommodate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Our luxury 2BHK vacation home comfortably accommodates 6 to 8 guests, making it ideal for families and groups."
            }
          },
          {
            "@type": "Question",
            "name": "What amenities are included at Aadhya Abode?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aadhya Abode includes two AC bedrooms, high-speed Wi-Fi, 100% power backup, a fully equipped modular kitchen, smart TV, and private parking."
            }
          },
          {
            "@type": "Question",
            "name": "How do I book Aadhya Abode?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can book instantly via WhatsApp at +91 80151 60563. Booking confirmations are shared directly on WhatsApp with complete check-in instructions."
            }
          },
          {
            "@type": "Question",
            "name": "What is the check-in and check-out time?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Standard check-in is at 2:00 PM and check-out is at 11:00 AM. Early check-in and late check-out can be arranged on prior request subject to availability."
            }
          },
          {
            "@type": "Question",
            "name": "Is Aadhya Abode suitable for a family trip to Kanyakumari?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! Aadhya Abode is specifically designed for families. With two spacious bedrooms, a full kitchen, and a child-friendly layout, it is the perfect base for exploring Kanyakumari's sunrise points, temples, and beaches."
            }
          }
        ]
      }
    ]
  }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 scroll-smooth">
  {{ partial "header.html" . }}

  <!-- Non-hero sections use scroll-mt-20 on the section element for anchor offset -->
  <main id="main-content">
    {{ block "main" . }}{{ end }}

  {{ partial "scripts.html" . }}
</body>
</html>
