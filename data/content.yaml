abodes_section:
  heading: "Vacation Homes in Kanyakumari — Book Your Stay"
  description: "Fully furnished luxury 2BHK holiday home in Kanyakumari for families and groups. Self check-in, private parking, and instant WhatsApp booking."

# ── New: "Why Book Direct" trust/CRO section ─────────────────────
# Rendered as a 3-column strip just above the FAQ section.
# Framed as a benefit to the guest, not a knock against Airbnb.
why_direct:
  heading: "Why Book Direct with Us"
  description: "Skip the wait — message us directly for the fastest, most flexible way to confirm your stay."
  columns:
    - title: "Instant Confirmation"
      text: "No back-and-forth. Message us on WhatsApp and get real-time availability and confirmation from the host directly."
    - title: "Talk to the Host Directly"
      text: "Ask about early check-in, local tips, or special requests — you're chatting with the host, not a support queue."
    - title: "Flexible on Request"
      text: "Early check-in, late check-out, and small customizations are easier to arrange when you book direct."

amenities:
  heading: "All-In-One Comfort Services"
  description: "Everything you need for a seamless coastal vacation — from stay essentials to local guidance."
  items:
    - title: "Stay Perks"
      text: "High-speed Wi-Fi, 100% power backup, AC bedrooms, and secure gated premises."
    - title: "Food & Dining"
      text: "Kitchen equipped for self-cooking. Online Food delivery available for convinience - Swiggy and Zomato. Nearby Hotels and supermarkets in reach."
    - title: "Transit Support"
      text: "Airport & railway station pickups and drop-offs on request with trusted partners."
    - title: "Local Exploration"
      text: "Curated itineraries for sunrise points, beaches, and temples."

